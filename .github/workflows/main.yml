name: Markt-Bericht

on:
  schedule:
    # Mo–Fr um 06:15 UTC = 07:15 Uhr Winterzeit / 08:15 Uhr Sommerzeit (Berlin).
    # Dann sind die Schlusskurse aus Europa und den USA vom Vortag da.
    - cron: "15 6 * * 1-5"
  workflow_dispatch: {}   # Knopf "Run workflow" für einen Lauf von Hand

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bericht:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Bericht erstellen
        run: python main.py --ausgabe ausgabe

      - name: Webseite veröffentlichen
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ausgabe
      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub schickt dir jeden neuen Eintrag ("Issue") automatisch per E-Mail.
      # Dafür wird kein Passwort gebraucht – nur der eingebaute GitHub-Schlüssel.
      - name: Benachrichtigung per E-Mail
        if: hashFiles('ausgabe/senden.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '\n\n@%s – dein neuer Bericht ist da.\n' "${{ github.repository_owner }}" >> ausgabe/zusammenfassung.md
          gh label create marktbericht --color 0969da --description "Markt-Bericht" --force
          gh issue create --title "$(cat ausgabe/titel.txt)" \
                          --body-file ausgabe/zusammenfassung.md \
                          --label marktbericht
