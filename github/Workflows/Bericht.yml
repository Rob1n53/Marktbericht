WOCHENTAGE = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"]


def _e(x):
    return html.escape(str(x))


def pct(x, nachkomma=1, vorzeichen=True):
    if x is None or (isinstance(x, float) and math.isnan(x)):
        return "–"
    s = f"{x * 100:{'+' if vorzeichen else ''}.{nachkomma}f} %"
    return s.replace(".", ",")


def zahl(x, nachkomma=2):
    if x is None or (isinstance(x, float) and math.isnan(x)):
        return "–"
    return f"{x:,.{nachkomma}f}".replace(",", "X").replace(".", ",").replace("X", ".")


def eur(x):
    return "–" if x is None or (isinstance(x, float) and math.isnan(x)) else f"{zahl(x, 0)} €"


def farbe_pct(x):
    if x is None or (isinstance(x, float) and math.isnan(x)):
        return "#6e7781"
    return "#1a7f37" if x >= 0 else "#cf222e"


def _perf_zellen(perf, keys=("1T", "1W", "1M", "lfd. Jahr")):
    return "".join(f'<td class="n" style="color:{farbe_pct(perf.get(k))}">{pct(perf.get(k))}</td>' for k in keys)


